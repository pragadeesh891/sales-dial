name: sales-dial

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: callcenter
      POSTGRES_USER: cc
      POSTGRES_PASSWORD: cc_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cc -d callcenter"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: cc
      RABBITMQ_DEFAULT_PASS: cc_dev_pw
      RABBITMQ_DEFAULT_VHOST: callcenter
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cc_minio
      MINIO_ROOT_PASSWORD: cc_minio_dev_pw
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      LOG_LEVEL: info
      BASE_URL: "http://backend:8080"
      DATABASE_URL: "postgres://cc:cc_dev_pw@postgres:5432/callcenter?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      AMQP_URL: "amqp://cc:cc_dev_pw@rabbitmq:5672/callcenter"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "cc_minio"
      MINIO_SECRET_KEY: "cc_minio_dev_pw"
      MINIO_BUCKET: "recordings"
      MINIO_USE_SSL: "false"
      JWT_SECRET: "supersecretjwtkeyforcallcenterdev123456"
      JWT_REFRESH_SECRET: "supersecretrefreshjwtkeyforcallcenterdev123456"
      DIALING_HOUR_START: "8"
      DIALING_HOUR_END: "20"
      TELEPHONY_PROVIDER: "africas_talking"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
      CALLCENTER_API_BASE_URL: "http://backend:8080"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  miniodata:

